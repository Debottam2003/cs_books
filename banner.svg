<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="s2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="s3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="s4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="s5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="s6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="140" fill="url(#glow)"/>

  <!-- faint circuit dots -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="60" cy="40" r="2.5"/>
    <circle cx="120" cy="70" r="2.5"/>
    <circle cx="1140" cy="45" r="2.5"/>
    <circle cx="1080" cy="90" r="2.5"/>
    <circle cx="90" cy="230" r="2.5"/>
    <circle cx="1110" cy="220" r="2.5"/>
  </g>

  <!-- bookshelf silhouette, bottom right -->
  <g transform="translate(870,120)">
    <rect x="0"   y="60" width="26" height="100" fill="url(#s1)" rx="2"/>
    <rect x="30"  y="30" width="26" height="130" fill="url(#s2)" rx="2"/>
    <rect x="60"  y="75" width="26" height="85"  fill="url(#s3)" rx="2"/>
    <rect x="90"  y="15" width="26" height="145" fill="url(#s4)" rx="2"/>
    <rect x="120" y="50" width="26" height="110" fill="url(#s5)" rx="2"/>
    <rect x="150" y="40" width="26" height="120" fill="url(#s6)" rx="2"/>
    <rect x="180" y="65" width="26" height="95"  fill="url(#s1)" rx="2"/>
    <rect x="210" y="25" width="26" height="135" fill="url(#s2)" rx="2"/>
    <rect x="240" y="55" width="26" height="105" fill="url(#s3)" rx="2"/>
    <rect x="-4" y="158" width="278" height="8" fill="#0f172a" rx="2"/>
  </g>

  <!-- title -->
  <text x="70" y="115" font-family="Verdana, Geneva, sans-serif" font-size="54" font-weight="bold" fill="#ffffff">
    CS <tspan fill="#facc15">Library</tspan>
  </text>
  <text x="72" y="150" font-family="Verdana, Geneva, sans-serif" font-size="18" fill="#c7d2fe" letter-spacing="1">
    one shelf for all of Computer Science
  </text>

  <!-- tag pills -->
  <g font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#0f172a" font-weight="bold">
    <rect x="72" y="175" width="88" height="26" rx="13" fill="#38bdf8"/>
    <text x="88" y="192">SYSTEMS</text>

    <rect x="170" y="175" width="64" height="26" rx="13" fill="#34d399"/>
    <text x="184" y="192">AI/ML</text>

    <rect x="244" y="175" width="66" height="26" rx="13" fill="#f472b6"/>
    <text x="258" y="192">CLOUD</text>

    <rect x="320" y="175" width="60" height="26" rx="13" fill="#facc15"/>
    <text x="333" y="192">WEB</text>

    <rect x="390" y="175" width="100" height="26" rx="13" fill="#a78bfa"/>
    <text x="404" y="192">DESIGN</text>
  </g>
</svg>
